          const single = pvCableDesign({mode:"1ph",material:"cu",voltage:230,current:20,length:25,area:4,temp:70,limit:3,pf:.9,reactance:.08,baseAmpacity:32,ambientFactor:1,groupFactor:1,installationFactor:1});
