          assert.throws(()=>pvCableDesign({mode:"dc",material:"cu",voltage:0,current:10,length:10,area:2.5,temp:70,limit:3}),/valid positive values/);
          assert.throws(()=>pvCableDesign({mode:"3ph",material:"cu",voltage:415,current:10,length:10,area:2.5,temp:70,limit:3,pf:1.2}),/valid positive values/);
          assert.throws(()=>pvCableDesign({mode:"dc",material:"cu",voltage:600,current:10,length:10,area:2.5,temp:70,limit:3,ambientFactor:0}),/valid positive values/);
          console.log("Cable engineering: DC loop drop, single/three-phase AC R-X drop, temperature correction, combined derating and invalid-input guards passed");
