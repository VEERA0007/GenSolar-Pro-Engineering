name: Build GenSolar Pro Engineering APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    name: Build offline-first Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools
      - name: Accept Android SDK licences
        shell: bash
        run: yes | sdkmanager --licenses || true
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate HTML and embedded JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          self.ids.append(value)
          parser = Check()
          parser.feed(source)
          duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))
          scripts = re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>", source, re.S | re.I)
          if not scripts:
              raise SystemExit("No embedded application script found")
          Path("/tmp/gensolar-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"HTML parsed; {len(parser.ids)} unique IDs; {len(scripts)} embedded script(s)")
          PY
          node --check /tmp/gensolar-inline.js
      - name: Test STAAD portal frame model and STAAD.Pro export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          start = source.index("function staadBuildModel(")
          end = source.index("function staadRenderModel(", start)
          Path("/tmp/gensolar-staad.js").write_text(source[start:end], encoding="utf-8")
          PY
          cat >> /tmp/gensolar-staad.js <<'JS'
          const assert = require("node:assert/strict");
          const input = {
            staadSpan:20, staadLength:30, staadFrameSpacing:5,
            staadEaveHeight:6, staadRoofRise:2,
            staadRoofDead:0.25, staadRoofLive:0.75,
            staadWindUplift:0.9, staadWindSide:0.6, staadFy:250,
            support:"PINNED", windFace:"left",
            columnSection:"ISMB300", rafterSection:"ISMB300",
            purlinSection:"ISMC150", braceSection:"ISA50X50X6"
          };
          const model = staadBuildModel(input);
          assert.equal(model.frameCount,7);
          assert.equal(model.frameSpacing,5);
          assert.equal(model.nodes.length,35);
          assert.equal(model.members.length,94);
          assert.equal(model.purlinCount,18);
          assert.equal(model.braceCount,48);
          assert.equal(model.loads.length,4);
          assert.equal(model.loads[0].selfWeight,true);
          assert.equal(model.loads[0].memberLoads[0].value,-0.625);
          assert.equal(model.loads[0].memberLoads[4].value,-1.25);
          assert.deepEqual(model.combinations.map(x=>x.id),[5,6,7,8]);
          const std=staadBuildStd(model);
          for(const required of ["STAAD SPACE","UNIT METER KN","JOINT COORDINATES",
            "MEMBER INCIDENCES","DEFINE MATERIAL START","SUPPORTS","MEMBER PROPERTY INDIAN",
            "LOAD 1 LOADTYPE Dead","SELFWEIGHT Y -1","LOAD 3 LOADTYPE Wind",
            "LOAD COMB 6 1 0.9 3 1.5","PERFORM ANALYSIS PRINT STATICS CHECK",
            "CODE IS800 LSD","CHECK CODE ALL","FINISH"]) assert.ok(std.includes(required),"Missing STAAD command: "+required);
          assert.throws(()=>staadBuildModel({...input,staadLength:301}),/supported engineering range/);
          assert.throws(()=>staadBuildModel({...input,staadFrameSpacing:1,staadLength:100}),/2–61 portal frames/);
          assert.throws(()=>staadBuildStd({...model,properties:{...model.properties,column:"ISMB300; DELETE"}}),/valid STAAD section-table name/);
          console.log("STAAD model/export tests passed: portal geometry, tributary loads, supports, member groups, load cases/combinations, IS 800 directives and invalid-input guards");
          JS
          node /tmp/gensolar-staad.js
      - name: Test STAAD steel take-off and procurement mass schedule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          start = source.index("function staadBuildModel(")
          end = source.index("function staadBuildStd(", start)
          model_source = source[start:end]
          start = source.index("function staadBuildSteelTakeoff(")
          end = source.index("function staadCalculateTakeoff(", start)
          takeoff_source = source[start:end]
          Path("/tmp/gensolar-steel-takeoff.js").write_text(model_source + "\n" + takeoff_source, encoding="utf-8")
          PY
          cat >> /tmp/gensolar-steel-takeoff.js <<'JS'
          const assert = require("node:assert/strict");
          const p={staadSpan:20,staadLength:30,staadFrameSpacing:5,staadEaveHeight:6,staadRoofRise:2,
            staadRoofDead:.25,staadRoofLive:.75,staadWindUplift:.9,staadWindSide:.6,staadFy:250,
            support:"PINNED",windFace:"left",columnSection:"ISMB300",rafterSection:"ISMB300",
            purlinSection:"ISMC150",braceSection:"ISA50X50X6"};
          const model=staadBuildModel(p);
          const takeoff=staadBuildSteelTakeoff(model,{staadColumnKgM:42.2,staadRafterKgM:42.2,
            staadPurlinKgM:16.8,staadBraceKgM:4.5,staadSteelWaste:5});
          assert.equal(takeoff.totalMembers,model.members.length);
          assert.equal(takeoff.details.length,model.members.length);
          assert.equal(takeoff.rows.find(x=>x.type==="column").count,14);
          assert.equal(takeoff.rows.find(x=>x.type==="rafter").count,14);
          assert.equal(takeoff.rows.find(x=>x.type==="purlin").count,18);
          assert.equal(takeoff.rows.find(x=>x.type==="brace").count,48);
          assert.equal(takeoff.details[0].id,model.members[0].id);
          assert.equal(takeoff.details[0].frame,model.members[0].frame+1);
          assert.ok(takeoff.details.every(x=>x.length>0&&x.startNode>0&&x.endNode>0));
          for(const row of takeoff.rows){assert.ok(row.length>0);assert.ok(Math.abs(row.procurementKg-row.netKg*1.05)<1e-8)}
          assert.ok(Math.abs(takeoff.procurementKg-takeoff.netKg*1.05)<1e-7);
          assert.throws(()=>staadBuildSteelTakeoff(model,{staadColumnKgM:0,staadRafterKgM:42,
            staadPurlinKgM:16,staadBraceKgM:4,staadSteelWaste:5}),/verified positive kg\/m/);
          assert.throws(()=>staadBuildSteelTakeoff(model,{staadColumnKgM:42,staadRafterKgM:42,
            staadPurlinKgM:16,staadBraceKgM:4,staadSteelWaste:21}),/between 0 and 20/);
          console.log("STAAD steel take-off passed: individual cut lengths, frame/node references, group totals, verified kg/m inputs, wastage and invalid-input guards");
          JS
          node /tmp/gensolar-steel-takeoff.js
      - name: Test STAAD steel take-off DPR schedule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          start = source.index("function staadDprSection()")
          end = source.index("\nfunction ", start)
          Path("/tmp/gensolar-staad-dpr.js").write_text(source[start:end], encoding="utf-8")
          PY
          cat >> /tmp/gensolar-staad-dpr.js <<'JS'
          const assert = require("node:assert/strict");
          global.escapeHtml = value => String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
          const model={frameCount:2,nodes:[{id:1}],members:[{id:1}],purlinCount:2,braceCount:4,
            span:12,length:20,eave:5,rise:1,frameSpacing:4.0,
            loads:[{id:1,name:"Dead"},{id:2,name:"Wind"}],combinations:[{id:5,name:"1.5G+1.5W"}],
            properties:{column:"ISMB300",rafter:"ISMB300",purlin:"ISMC150",brace:"ISA50X50X6"}};
          global.state={staadModel:model,staadTakeoff:null};
          let html=staadDprSection();
          assert.match(html,/Not calculated/);
          const takeoff={basis:"Centreline length × verified section mass",totalMembers:2,totalLength:15,
            netKg:300,allowanceKg:15,procurementKg:315,waste:5,
            rows:[{type:"column",section:"ISMB300",count:2,length:10,kgm:30,netKg:300,procurementKg:315}],
            details:[{id:1,type:"column",frame:1,startNode:1,endNode:2,length:5,kgm:30,netKg:150,procurementKg:157.5},
              {id:2,type:"column",frame:2,startNode:3,endNode:4,length:5,kgm:30,netKg:150,procurementKg:157.5}]};
          state.staadTakeoff=takeoff;
          html=staadDprSection();
          for(const value of ["STAAD steel take-off","15.000 m","300.00 kg","5.0%","315.00 kg",
            "Group","ISMB300","Individual member cut / length register","Member ID","Start node",
            "157.50","Procurement estimate only","not a certified bill of materials"])
            assert.ok(html.includes(value),"Missing DPR content: "+value);
          state.staadTakeoff={...takeoff,rows:[{...takeoff.rows[0],section:"<script>bad</script>"}]};
          html=staadDprSection();
          assert.ok(html.includes("&lt;script&gt;bad&lt;/script&gt;"),"DPR must HTML-escape section labels");
          assert.ok(!html.includes("<script>bad</script>"),"untrusted section labels must not become markup");
          console.log("STAAD DPR schedule passed: absent-takeoff state, group totals, individual member records, procurement allowance, limitations and HTML escaping");
          JS
          node /tmp/gensolar-staad-dpr.js
      - name: Test STAAD 3D DXF drawing export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          start = source.index("function staadExportDxf()")
          end = source.index("function staadExportSchedules()", start)
          Path("/tmp/gensolar-staad-dxf.js").write_text(source[start:end], encoding="utf-8")
          PY
          cat >> /tmp/gensolar-staad-dxf.js <<'JS'
          const assert = require("node:assert/strict");
          const model = {nodes:[{id:1,x:0,y:0,z:0},{id:2,x:0,y:6,z:0}],
            members:[{id:1,a:1,b:2,type:"column"}]};
          global.state={staadModel:model};
          let saved=null;
          global.download=(name,data,type)=>{saved={name,data,type};};
          global.$=()=>({textContent:""});
          staadExportDxf();
          assert.equal(saved.name,"GenSolar-STAAD-3D-Frame.dxf");
          assert.equal(saved.type,"application/dxf");
          for(const layer of ["STAAD_COLUMNS","STAAD_RAFTERS","STAAD_PURLINS","STAAD_BRACING","STAAD_NODES"])
            assert.ok(saved.data.includes(layer),"Missing DXF layer: "+layer);
          assert.ok(saved.data.includes("$INSUNITS"));
          assert.ok(saved.data.includes("6000"),"Metre coordinates must export as millimetres");
          assert.ok(saved.data.endsWith("EOF\n"));
          console.log("STAAD 3D DXF export passed: millimetre units, structural layers, node geometry and valid file terminator");
          JS
          node /tmp/gensolar-staad-dxf.js
      - name: Test complete-backup ZIP integrity and path validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          start = source.index("function zipCrc32(")
          end = source.index("async function exportCompleteProjectBackup", start)
          Path("/tmp/gensolar-zip-test.js").write_text(source[start:end], encoding="utf-8")
          PY
          cat >> /tmp/gensolar-zip-test.js <<'JS'
          const assert = require("node:assert/strict");
          const entries = [
            { name: "project.json", data: new TextEncoder().encode('{"project":{"id":"qa"}}') },
            { name: "attachments/sample.bin", data: new Uint8Array([0, 1, 2, 127, 128, 255]) },
            { name: "attachments/測試.txt", data: new TextEncoder().encode("GenSolar backup ✓") }
          ];
          const archive = zipBuild(entries);
          const restored = zipRead(archive.buffer);
          assert.equal(restored.size, entries.length);
          for (const entry of entries) {
            const actual = restored.get(entry.name);
            assert.ok(actual, "Missing ZIP entry: " + entry.name);
            assert.deepEqual(Array.from(actual), Array.from(entry.data));
          }
          const corrupted = archive.slice();
          corrupted[42] ^= 1;
          assert.throws(() => zipRead(corrupted.buffer), /Integrity check failed/);
          const unsafe = zipBuild([{ name: "../outside.txt", data: new Uint8Array([1]) }]);
          assert.throws(() => zipRead(unsafe.buffer), /Unsafe or duplicate ZIP path/);
          console.log("ZIP round-trip, binary/UTF-8 payloads, CRC corruption detection and path traversal rejection passed");
          JS
          node /tmp/gensolar-zip-test.js
      - name: Test PV string-to-MPPT allocation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          start = source.index("function buildStringMpptPlan(")
          end = source.index("\nfunction calculateCompatibility()", start)
          Path("/tmp/gensolar-string-plan.js").write_text(source[start:end], encoding="utf-8")
          PY
          cat >> /tmp/gensolar-string-plan.js <<'JS'
          const assert = require("node:assert/strict");
          const plan = buildStringMpptPlan(10, 20, 4);
          assert.deepEqual(plan.allocation, [3, 3, 2, 2]);
          assert.equal(plan.records.length, 10);
          assert.deepEqual(plan.records[0], { string: 1, mppt: 1, modules: 20, firstModule: 1, lastModule: 20 });
          assert.deepEqual(plan.records[3], { string: 4, mppt: 2, modules: 20, firstModule: 61, lastModule: 80 });
          assert.deepEqual(plan.records[9], { string: 10, mppt: 4, modules: 20, firstModule: 181, lastModule: 200 });
          const one = buildStringMpptPlan(1, 12, 4);
          assert.deepEqual(one.allocation, [1, 0, 0, 0]);
          assert.deepEqual(one.records[0], { string: 1, mppt: 1, modules: 12, firstModule: 1, lastModule: 12 });
          assert.throws(() => buildStringMpptPlan(0, 20, 4), /positive integers/);
          assert.throws(() => buildStringMpptPlan(4, 0, 4), /positive integers/);
          assert.throws(() => buildStringMpptPlan(4, 20, 0), /positive integers/);
          assert.throws(() => buildStringMpptPlan(2.5, 20, 4), /positive integers/);
          assert.throws(() => buildStringMpptPlan(4, 20.5, 4), /positive integers/);
          assert.throws(() => buildStringMpptPlan(4, 20, 1.5), /positive integers/);
          console.log("MPPT string allocation: balanced channels, sequential module references, single-string edge case and integer-input guards passed");
          JS
      - name: Test strict PV module and MPPT integer inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          start = source.index("function isPositiveIntegerInput(")
          end = source.index("function buildStringMpptPlan(", start)
          Path("/tmp/gensolar-integer-inputs.js").write_text(source[start:end], encoding="utf-8")
          PY
          cat >> /tmp/gensolar-integer-inputs.js <<'JS'
          const assert = require("node:assert/strict");
          for (const value of [1, 2, 200, "12", "4"]) assert.equal(isPositiveIntegerInput(value), true);
          for (const value of [0, -1, 1.5, "2.5", "", "abc", null, NaN, Infinity]) assert.equal(isPositiveIntegerInput(value), false);
          console.log("PV module and MPPT input validation: positive whole numbers accepted; fractions, zero, negatives and invalid values rejected");
          JS
          node /tmp/gensolar-integer-inputs.js
      - name: Test temperature-adjusted PV string voltages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          start = source.index("function pvTemperatureAdjustedVoltage(")
          end = source.index("\nfunction electrical(", start)
          Path("/tmp/gensolar-temperature-voltage.js").write_text(source[start:end], encoding="utf-8")
          PY
          cat >> /tmp/gensolar-temperature-voltage.js <<'JS'
          const assert = require("node:assert/strict");
          const coldVoc = pvTemperatureAdjustedVoltage(49.5, -0.28, -10);
          const coldVmp = pvTemperatureAdjustedVoltage(41.5, -0.30, -10);
          const hotVmp = pvTemperatureAdjustedVoltage(41.5, -0.30, 70);
          assert.ok(Math.abs(coldVoc - 54.351) < 1e-9, "cold Voc correction must increase voltage below reference temperature");
          assert.ok(Math.abs(coldVmp - 45.8575) < 1e-9, "cold Vmp correction must increase voltage below reference temperature");
          assert.ok(Math.abs(hotVmp - 35.8975) < 1e-9, "hot Vmp correction must reduce voltage above reference temperature");
          assert.equal(pvTemperatureAdjustedVoltage(40, -0.3, 25), 40, "voltage at reference temperature must remain unchanged");
          assert.throws(() => pvTemperatureAdjustedVoltage(0, -0.3, -10), /positive/);
          assert.throws(() => pvTemperatureAdjustedVoltage(40, "invalid", -10), /finite/);
          assert.throws(() => pvTemperatureAdjustedVoltage(40, -10, 100), /positive and finite/);
          console.log("PV temperature-voltage tests passed: cold Voc, cold Vmp, hot Vmp, reference temperature and invalid-input guards");
          JS
          node /tmp/gensolar-temperature-voltage.js
      - name: Test PV polygon geometry and setbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          start = source.index("function cross(")
          end = source.index("function pvCircleInsidePolygon(", start)
          Path("/tmp/gensolar-pv-geometry.js").write_text(source[start:end], encoding="utf-8")
          PY
          cat >> /tmp/gensolar-pv-geometry.js <<'JS'
          const assert = require("node:assert/strict");
          const square = [{x:0,y:0},{x:10,y:0},{x:10,y:10},{x:0,y:10}];
          assert.equal(pvRectFits(2, 2, 2, 2, square, 0.5), true, "interior rectangle with setback should fit");
          assert.equal(pvRectFits(9, 2, 2, 2, square, 0), false, "rectangle crossing roof boundary must fail");
          assert.equal(pvRectFits(0.2, 2, 1, 1, square, 0.5), false, "rectangle violating edge setback must fail");
          assert.equal(pvRectFits(1, 1, 2, 2, square, 0.5), true, "rectangle meeting setback must fit");
          const concave = [{x:0,y:0},{x:8,y:0},{x:8,y:3},{x:3,y:3},{x:3,y:8},{x:0,y:8}];
          assert.equal(pvRectFits(1, 4, 1, 1, concave, 0), true, "rectangle in concave polygon arm should fit");
          assert.equal(pvRectFits(4, 4, 1, 1, concave, 0), false, "rectangle in concave cut-out must fail");
          assert.equal(segmentsIntersect({x:0,y:0},{x:4,y:4},{x:0,y:4},{x:4,y:0}), true, "crossing segments should intersect");
          assert.equal(segmentsIntersect({x:0,y:0},{x:4,y:0},{x:2,y:1},{x:2,y:3}), false, "separated segments must not intersect");
          console.log("PV polygon geometry: interior fit, boundary rejection, setback, concave-zone and segment-intersection tests passed");
          JS
          node /tmp/gensolar-pv-geometry.js
      - name: Test PV layout module overlap and boundary validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          start = source.index("function validatePvLayout(")
          end = source.index("\nfunction layoutCalc(", start)
          Path("/tmp/gensolar-layout-validation.js").write_text(source[start:end], encoding="utf-8")
          PY
          cat >> /tmp/gensolar-layout-validation.js <<'JS'
          const assert = require("node:assert/strict");
          function pvRectInAccessCorridor(){ return false; }
          function pvRectOverlapsAny(){ return false; }
          function pvRectObstacleClearAll(){ return true; }
          const base = (modules) => validatePvLayout(modules, true, [], 20, 20, 1, [], [], 0, [], "none", 0);
          const valid = base([{x:2,y:2,w:2,h:1},{x:5,y:2,w:2,h:1}]);
          assert.equal(valid.valid, true, "separated modules inside roof boundary should pass");
          const overlap = base([{x:2,y:2,w:2,h:1},{x:3,y:2.5,w:2,h:1}]);
          assert.equal(overlap.valid, false, "overlapping modules must fail");
          assert.match(overlap.errors.join(" "), /overlap/i, "overlap failure should be explicit");
          const outside = base([{x:19,y:2,w:2,h:1}]);
          assert.equal(outside.valid, false, "module crossing roof boundary must fail");
          assert.match(outside.errors.join(" "), /roof boundary or setback/i);
          const setback = validatePvLayout([{x:0.5,y:2,w:2,h:1}], true, [], 20, 20, 1, [], [], 0, [], "none", 0);
          assert.equal(setback.valid, false, "legacy roof setback must be enforced");
          console.log("PV layout validation: valid layout, module overlap, roof boundary and legacy setback tests passed");
          JS
          node /tmp/gensolar-layout-validation.js
      - name: Test PV obstacle clearance and access corridors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          start = source.index("function parseObstacleCircles(")
          end = source.index("function pvPointInPoly(", start)
          Path("/tmp/gensolar-obstacle-corridor.js").write_text(source[start:end], encoding="utf-8")
          PY
          cat >> /tmp/gensolar-obstacle-corridor.js <<'JS'
          const assert = require("node:assert/strict");
          const circles = parseObstacleCircles("5,5,1");
          const rects = parseObstacleRectangles("8,2,2,3");
          const corridors = parseCorridorRectangles("0,0,1,10;9,0,1,10");
          assert.equal(circles.length, 1);
          assert.equal(rects.length, 1);
          assert.equal(corridors.length, 2);
          assert.equal(pvRectObstacleClearAll(1,1,2,2, circles, [], 0), true, "module clear of circular obstacle should pass");
          assert.equal(pvRectObstacleClearAll(4.5,4.5,2,2, circles, [], 0), false, "module intersecting circular obstacle should fail");
          assert.equal(pvRectObstacleClearAll(7.5,3,1,1, [], rects, 0), false, "module intersecting rectangular obstacle should fail");
          assert.equal(pvRectObstacleClearAll(7.5,3,1,1, [], rects, 0.5), false, "rectangular obstacle clearance must be enforced");
          assert.equal(pvRectObstacleClearAll(2,2,1,1, [], rects, 0.5), true, "module outside rectangular obstacle clearance should pass");
          const bounds = {minX:0,minY:0,maxX:10,maxY:10};
          assert.equal(pvRectInAccessCorridor(0.2,4,1,1,bounds,"left",1), true, "left access corridor must be detected");
          assert.equal(pvRectInAccessCorridor(8.8,4,1,1,bounds,"right",1), true, "right access corridor must be detected");
          assert.equal(pvRectInAccessCorridor(4,0.2,1,1,bounds,"top",1), true, "top access corridor must be detected");
          assert.equal(pvRectInAccessCorridor(4,8.8,1,1,bounds,"bottom",1), true, "bottom access corridor must be detected");
          assert.equal(pvRectInAccessCorridor(3,3,1,1,bounds,"left",1), false, "module outside corridor must pass");
