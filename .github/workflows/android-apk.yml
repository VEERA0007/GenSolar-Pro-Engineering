name: Build GenSolar Pro Engineering APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    name: Build offline-first Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools
      - name: Accept Android SDK licences
        shell: bash
        run: yes | sdkmanager --licenses || true
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate HTML and embedded JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          self.ids.append(value)
          parser = Check()
          parser.feed(source)
          duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))
          scripts = re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>", source, re.S | re.I)
          if not scripts:
              raise SystemExit("No embedded application script found")
          Path("/tmp/gensolar-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          print(f"HTML parsed; {len(parser.ids)} unique IDs; {len(scripts)} embedded script(s)")
          PY
          node --check /tmp/gensolar-inline.js
      - name: Test complete-backup ZIP integrity and path validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          start = source.index("function zipCrc32(")
          end = source.index("async function exportCompleteProjectBackup", start)
          Path("/tmp/gensolar-zip-test.js").write_text(source[start:end], encoding="utf-8")
          PY
          cat >> /tmp/gensolar-zip-test.js <<'JS'
          const assert = require("node:assert/strict");
          const entries = [
            { name: "project.json", data: new TextEncoder().encode('{"project":{"id":"qa"}}') },
            { name: "attachments/sample.bin", data: new Uint8Array([0, 1, 2, 127, 128, 255]) },
            { name: "attachments/測試.txt", data: new TextEncoder().encode("GenSolar backup ✓") }
          ];
          const archive = zipBuild(entries);
          const restored = zipRead(archive.buffer);
          assert.equal(restored.size, entries.length);
          for (const entry of entries) {
            const actual = restored.get(entry.name);
            assert.ok(actual, "Missing ZIP entry: " + entry.name);
            assert.deepEqual(Array.from(actual), Array.from(entry.data));
          }
          const corrupted = archive.slice();
          corrupted[42] ^= 1;
          assert.throws(() => zipRead(corrupted.buffer), /Integrity check failed/);
          const unsafe = zipBuild([{ name: "../outside.txt", data: new Uint8Array([1]) }]);
          assert.throws(() => zipRead(unsafe.buffer), /Unsafe or duplicate ZIP path/);
          console.log("ZIP round-trip, binary/UTF-8 payloads, CRC corruption detection and path traversal rejection passed");
          JS
          node /tmp/gensolar-zip-test.js
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenSolar-Pro-Engineering-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
